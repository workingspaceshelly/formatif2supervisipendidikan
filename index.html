<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tes Formatif 2 MK Supervisi Pendidikan</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#1d2433;--muted:#5d677a;--primary:#1f4e78;--onprimary:#fff;--ok:#1b7f4b;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fdecea;--line:#d9dee8;--warn:#b26a00}
@media (prefers-color-scheme: dark){:root{--bg:#12161d;--card:#1c222c;--text:#e8ecf3;--muted:#9aa5b8;--primary:#6fa8dc;--onprimary:#0b1220;--ok:#4cc38a;--okbg:#16342a;--bad:#ff7b6e;--badbg:#3a1f1c;--line:#2e3644;--warn:#f0b35a}}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
h1{font-size:1.4rem;margin:0 0 4px}
.muted{color:var(--muted);font-size:.92rem}
label{display:block;font-weight:bold;margin:14px 0 4px}
input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;font-size:1rem;background:var(--card);color:var(--text)}
button{background:var(--primary);color:var(--onprimary);border:0;border-radius:6px;padding:10px 18px;font-size:1rem;font-weight:bold;cursor:pointer}
button.sec{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.err{color:var(--bad);margin-top:10px;min-height:1.2em}
.hidden{display:none!important}
ul.rules{margin:10px 0 0 18px;padding:0}
#bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
#bar .in{max-width:820px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#timer{font-size:1.3rem;font-weight:bold;font-variant-numeric:tabular-nums}
#timer.low{color:var(--bad)}
#nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
#nav button{padding:6px 0;font-size:.85rem;background:transparent;color:var(--text);border:1px solid var(--line)}
#nav button.done{background:var(--primary);color:var(--onprimary);border-color:var(--primary)}
.q .no{font-weight:bold;color:var(--primary)}
.q .teks{margin:4px 0 10px;font-weight:bold}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;cursor:pointer}
.opt:hover{border-color:var(--primary)}
.opt input{margin-top:4px}
.opt.benar{background:var(--okbg);border-color:var(--ok)}
.opt.salah{background:var(--badbg);border-color:var(--bad)}
.opt.static{cursor:default}
.skor{font-size:3rem;font-weight:bold;color:var(--primary);line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.4rem}
table.id td{padding:2px 12px 2px 0}
.tag{display:inline-block;font-size:.8rem;font-weight:bold;padding:1px 8px;border-radius:10px;margin-left:6px}
.tag.benar{background:var(--okbg);color:var(--ok)}
.tag.salah{background:var(--badbg);color:var(--bad)}
.tag.kosong{border:1px solid var(--line);color:var(--muted)}
.pem{margin-top:8px;font-size:.92rem;color:var(--muted)}
@media print{#bar,button,.noprint{display:none!important}body{background:#fff}}
</style>
</head>
<body>

<!-- ========== LAYAR 1: DATA PESERTA ========== -->
<div id="awal" class="wrap">
  <div class="card">
    <h1 id="judul"></h1>
    <p class="muted" id="subjudul"></p>
    <label for="nama">Nama</label>
    <input type="text" id="nama" autocomplete="off" placeholder="Nama lengkap">
    <label for="nim">NIM</label>
    <input type="text" id="nim" autocomplete="off" inputmode="numeric" placeholder="NIM">
    <label for="kelas">Kelas</label>
    <input type="text" id="kelas" autocomplete="off" placeholder="Contoh: 2024A">
    <div class="err" id="err"></div>
    <ul class="rules muted" id="aturan"></ul>
    <p><button id="btnMulai">Mulai Formatif 2</button></p>
  </div>
</div>

<!-- ========== LAYAR 2: KUIS ========== -->
<div id="kuis" class="hidden">
  <div id="bar"><div class="in">
    <div>Sisa waktu: <span id="timer">--:--</span></div>
    <div class="muted">Terjawab: <b id="terjawab">0</b>/<span id="total"></span></div>
    <button id="btnKumpul">Kumpulkan</button>
  </div></div>
  <div class="wrap">
    <div class="card"><div id="nav"></div></div>
    <div id="daftarSoal"></div>
    <div class="card" style="text-align:center">
      <p class="muted">Periksa kembali jawaban Anda sebelum mengumpulkan.</p>
      <button id="btnKumpul2">Kumpulkan Jawaban</button>
    </div>
  </div>
</div>

<!-- ========== LAYAR 3: HASIL ========== -->
<div id="hasil" class="wrap hidden">
  <div class="card">
    <h1>Hasil Tes</h1>
    <table class="id" id="idPeserta"></table>
    <p style="margin:16px 0 0" class="muted">Skor (0–100)</p>
    <div class="skor" id="skor"></div>
    <div class="grid">
      <div class="stat"><b id="sBenar"></b>Benar</div>
      <div class="stat"><b id="sSalah"></b>Salah</div>
      <div class="stat"><b id="sKosong"></b>Tidak dijawab</div>
      <div class="stat"><b id="sDurasi"></b>Waktu pengerjaan</div>
    </div>
    <p class="noprint" style="margin-top:16px"><button class="sec" onclick="window.print()">Cetak / Simpan PDF</button></p>
    <p class="muted noprint" id="infoKirim"></p>
  </div>
  <h2>Pembahasan</h2>
  <div id="review"></div>
</div>

/* ============ KODE PROGRAM ============ */
const KEY = "kuis_supervisi_v1";
const $ = id => document.getElementById(id);
let state = null, timerId = null;

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function fmt(ms){ ms=Math.max(0,ms); const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function tampil(id){ ["awal","kuis","hasil"].forEach(x=>$(x).classList.toggle("hidden", x!==id)); window.scrollTo(0,0); }

function init(){
  if(new URLSearchParams(location.search).has("reset")){ try{ localStorage.removeItem(KEY); }catch(e){} }
  document.title = CONFIG.JUDUL;
  $("judul").textContent = CONFIG.JUDUL;
  $("subjudul").textContent = SOAL.length + " soal pilihan ganda · waktu " + CONFIG.DURASI_MENIT + " menit";
  [ "Isi Nama, NIM, dan Kelas dengan benar sebelum mulai.",
    "Waktu berjalan sejak tombol Mulai ditekan dan tetap berjalan meskipun halaman ditutup.",
    "Tes dikumpulkan otomatis saat waktu habis.",
    "Skor dan jawaban yang benar ditampilkan setelah Anda mengumpulkan." ]
    .forEach(t=>$("aturan").appendChild(el("li",null,t)));
  $("total").textContent = SOAL.length;
  $("btnMulai").onclick = mulai;
  $("btnKumpul").onclick = $("btnKumpul2").onclick = () => kumpul(false);

  state = load();
  if(state && state.selesai){ tampilHasil(); }
  else if(state){
    if(Date.now() >= state.akhir){ kumpul(true); } else { tampilKuis(); }
  } else { tampil("awal"); }
}

function mulai(){
  const nama=$("nama").value.trim(), nim=$("nim").value.trim(), kelas=$("kelas").value.trim();
  if(!nama || !nim || !kelas){ $("err").textContent="Nama, NIM, dan Kelas wajib diisi."; return; }
  const idx = SOAL.map((_,i)=>i);
  const opsi = {};
  SOAL.forEach((_,i)=>{ opsi[i] = CONFIG.ACAK_OPSI ? shuffle([0,1,2,3]) : [0,1,2,3]; });
  const now = Date.now();
  state = { nama, nim, kelas, mulai:now, akhir:now+CONFIG.DURASI_MENIT*60000,
            order: CONFIG.ACAK_SOAL ? shuffle(idx) : idx, opsi, jawaban:{}, selesai:false, hasil:null };
  save();
  tampilKuis();
}

function tampilKuis(){
  const box = $("daftarSoal"), nav = $("nav");
  box.innerHTML = ""; nav.innerHTML = "";
  state.order.forEach((i,pos)=>{
    const s = SOAL[i];
    const c = el("div","card q"); c.id = "q"+pos;
    c.appendChild(el("div","no","Soal "+(pos+1)));
    c.appendChild(el("div","teks",s.q));
    state.opsi[i].forEach((orig,p)=>{
      const lb = el("label","opt");
      const r = document.createElement("input");
      r.type="radio"; r.name="q"+i; r.value=orig;
      if(state.jawaban[i]===orig) r.checked=true;
      r.onchange = () => { state.jawaban[i]=orig; save(); perbarui(); };
      lb.appendChild(r);
      lb.appendChild(el("span",null,"ABCD"[p]+". "+s.o[orig]));
      c.appendChild(lb);
    });
    box.appendChild(c);
    const b = el("button",null,String(pos+1)); b.id="n"+pos;
    b.onclick = () => $("q"+pos).scrollIntoView({behavior:"smooth",block:"start"});
    nav.appendChild(b);
  });
  perbarui();
  tampil("kuis");
  clearInterval(timerId);
  timerId = setInterval(tick,500); tick();
}

function perbarui(){
  let n=0;
  state.order.forEach((i,pos)=>{ const d = state.jawaban[i]!==undefined; if(d) n++; $("n"+pos).classList.toggle("done",d); });
  $("terjawab").textContent = n;
}

function tick(){
  const sisa = state.akhir - Date.now();
  $("timer").textContent = fmt(sisa);
  $("timer").classList.toggle("low", sisa < 5*60000);
  if(sisa <= 0){ kumpul(true); }
}

function hitung(){
  let benar=0, salah=0, kosong=0;
  SOAL.forEach((s,i)=>{ const j=state.jawaban[i]; if(j===undefined) kosong++; else if(j===s.k) benar++; else salah++; });
  const skor = Number((benar/SOAL.length*100).toFixed(1));
  return { benar, salah, kosong, skor };
}

function kumpul(otomatis){
  if(!state || state.selesai) return;
  if(!otomatis){
    const kosong = SOAL.length - Object.keys(state.jawaban).length;
    const msg = kosong>0 ? "Masih ada "+kosong+" soal yang belum dijawab. Kumpulkan sekarang?" : "Kumpulkan jawaban sekarang? Jawaban tidak dapat diubah lagi.";
    if(!confirm(msg)) return;
  }
  clearInterval(timerId);
  state.selesai = true;
  state.waktuSelesai = Math.min(Date.now(), state.akhir);
  state.hasil = hitung();
  save();
  kirim();
  tampilHasil();
}

function kirim(){
  if(!CONFIG.SCRIPT_URL) return;
  const h = state.hasil;
  const data = { nama:state.nama, nim:state.nim, kelas:state.kelas, skor:h.skor, benar:h.benar, salah:h.salah, kosong:h.kosong,
                 mulai:new Date(state.mulai).toISOString(), selesai:new Date(state.waktuSelesai).toISOString(),
                 jawaban: SOAL.map((_,i)=> state.jawaban[i]===undefined ? "-" : "ABCD"[state.jawaban[i]]).join("") };
  fetch(CONFIG.SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)})
    .then(()=>{ state.terkirim=true; save(); }).catch(()=>{});
}

function tampilHasil(){
  const h = state.hasil || hitung();
  const t = $("idPeserta"); t.innerHTML="";
  [["Nama",state.nama],["NIM",state.nim],["Kelas",state.kelas]].forEach(([k,v])=>{
    const tr=document.createElement("tr"); tr.appendChild(el("td",null,k)); tr.appendChild(el("td",null,": "+v)); t.appendChild(tr);
  });
  $("skor").textContent = h.skor;
  $("sBenar").textContent = h.benar; $("sSalah").textContent = h.salah; $("sKosong").textContent = h.kosong;
  $("sDurasi").textContent = fmt((state.waktuSelesai||state.akhir) - state.mulai);
  $("infoKirim").textContent = CONFIG.SCRIPT_URL ? "Hasil Anda telah dikirim ke dosen." : "Catatan: simpan tangkapan layar atau PDF halaman ini sebagai bukti.";

  const rv = $("review"); rv.innerHTML="";
  state.order.forEach((i,pos)=>{
    const s = SOAL[i], j = state.jawaban[i];
    const status = j===undefined ? "kosong" : (j===s.k ? "benar" : "salah");
    const c = el("div","card q");
    const head = el("div","no","Soal "+(pos+1));
    head.appendChild(el("span","tag "+status, status==="benar"?"Benar":status==="salah"?"Salah":"Tidak dijawab"));
    c.appendChild(head);
    c.appendChild(el("div","teks",s.q));
    state.opsi[i].forEach((orig,p)=>{
      let cls="opt static", mark="";
      if(orig===s.k){ cls+=" benar"; mark="  ✓ jawaban benar"; }
      else if(orig===j){ cls+=" salah"; mark="  ✗ jawaban Anda"; }
      if(orig===s.k && orig===j) mark="  ✓ jawaban Anda (benar)";
      const d = el("div",cls);
      d.appendChild(el("span",null,"ABCD"[p]+". "+s.o[orig]+mark));
      c.appendChild(d);
    });
    c.appendChild(el("div","pem","Pembahasan: "+s.p));
    rv.appendChild(c);
  });
  tampil("hasil");
}

window.addEventListener("beforeunload", e => { if(state && !state.selesai && !$("kuis").classList.contains("hidden")){ e.preventDefault(); e.returnValue=""; } });
init();
</script>
